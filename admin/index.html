<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mile High Sips — Admin</title>
  <style>
    .mhs-dup-btn {
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.3);
      border-radius: 4px;
      color: inherit;
      cursor: pointer;
      font-size: 11px;
      font-weight: 600;
      line-height: 1;
      margin-right: 6px;
      padding: 3px 9px;
      opacity: 0.8;
      transition: opacity 0.15s, background 0.15s;
      vertical-align: middle;
      white-space: nowrap;
      position: relative;
      z-index: 10;
    }
    .mhs-dup-btn:hover { opacity: 1; background: rgba(255,255,255,0.28); }
  </style>
</head>
<body>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script>
  (function () {
    var LOG = '[MHS Copy]';

    /* ── Capture-phase global listener ─────────────────────────────────────
       Fires BEFORE React's synthetic event system so we intercept the click
       before Decap's collapse/expand handler can swallow it.              */
    document.addEventListener('click', function (e) {
      // Only care about our injected buttons
      if (!e.target || !e.target.classList.contains('mhs-dup-btn')) return;

      e.stopPropagation();   // block React / Decap from collapsing the item
      e.preventDefault();

      var btn = e.target;
      var bar = btn.closest('[class*="StyledListItemTopBar"]');
      console.log(LOG, 'Click captured. bar:', bar ? 'found' : 'NOT found');
      if (bar) runCopy(bar, btn);
    }, true /* ← capture phase */);

    /* ── Inject 📋 Copy buttons ── */
    setTimeout(start, 3500);

    function start() {
      inject();
      var obs = new MutationObserver(function () {
        clearTimeout(window._mhsT);
        window._mhsT = setTimeout(inject, 400);
      });
      obs.observe(document.body, { childList: true, subtree: true });
    }

    function inject() {
      document.querySelectorAll('[class*="StyledListItemTopBar"]').forEach(function (bar) {
        if (bar.dataset.mhsDup) return;
        bar.dataset.mhsDup = '1';

        var btns = bar.querySelectorAll('button');
        if (!btns.length) return;
        var removeBtn = btns[btns.length - 1];

        var btn = document.createElement('button');
        btn.className = 'mhs-dup-btn';
        btn.textContent = '📋 Copy';
        btn.title = 'Duplicate this event';
        btn.type = 'button';
        // NOTE: no addEventListener here — the capture handler above handles all clicks

        removeBtn.parentNode.insertBefore(btn, removeBtn);
      });
    }

    /* ── Helpers ── */
    function setVal(el, val) {
      try {
        var proto = el.tagName === 'TEXTAREA'
          ? window.HTMLTextAreaElement.prototype
          : window.HTMLInputElement.prototype;
        Object.getOwnPropertyDescriptor(proto, 'value').set.call(el, val);
        el.dispatchEvent(new Event('input',  { bubbles: true }));
        el.dispatchEvent(new Event('change', { bubbles: true }));
      } catch (err) { console.warn(LOG, 'setVal error:', err); }
    }

    function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

    function getInputs(container) {
      if (!container) return [];
      return Array.from(container.querySelectorAll(
        'input:not([type="hidden"]):not([type="checkbox"]):not([type="radio"]):not([type="file"]), textarea'
      ));
    }

    function findAddButton() {
      // "Add Events" sits below all items in the list widget
      var all = Array.from(document.querySelectorAll('button')).filter(function (b) {
        return /^add\b/i.test(b.textContent.trim()) && b.textContent.trim().length < 30;
      });
      console.log(LOG, 'Add buttons on page:', all.map(function (b) { return '"' + b.textContent.trim() + '"'; }));
      return all.length ? all[all.length - 1] : null;
    }

    /* ── Main copy routine ── */
    async function runCopy(bar, btn) {
      btn.textContent = '⏳…';
      console.log(LOG, '── Copy start ──');

      try {
        /* 1 ── List item container (direct parent of the top bar) */
        var listItem = bar.parentElement;
        console.log(LOG, '1. listItem class:', listItem && listItem.className.substring(0, 80));

        /* 2 ── Read inputs (expand item first if collapsed / lazy-rendered) */
        var inputs = getInputs(listItem);
        console.log(LOG, '2a. inputs before expand:', inputs.length);

        if (inputs.length < 2) {
          // Toggle expand (first button in bar = collapse/expand)
          var expBtn = bar.querySelector('button:not(.mhs-dup-btn)');
          if (expBtn) { expBtn.click(); await sleep(500); }
          inputs = getInputs(listItem);
          console.log(LOG, '2b. inputs after expand:', inputs.length);
        }

        // Last fallback: walk one level up
        if (inputs.length < 2) {
          listItem = listItem.parentElement;
          inputs = getInputs(listItem);
          console.log(LOG, '2c. inputs after parent walk:', inputs.length,
                      '| class:', listItem && listItem.className.substring(0, 60));
        }

        if (!inputs.length) throw new Error('No fields found');

        var values = inputs.map(function (i) { return i.value; });
        console.log(LOG, '3. Captured', values.length, 'values:', values);

        /* 4 ── Click Add to create new blank item */
        btn.textContent = '⏳ adding';
        var addBtn = findAddButton();
        if (!addBtn) throw new Error('Add button not found');
        console.log(LOG, '4. Clicking:', addBtn.textContent.trim());

        var before = document.querySelectorAll('[class*="StyledListItemTopBar"]').length;
        addBtn.click();

        /* 5 ── Wait for the new item's top bar to appear */
        var newBar = null;
        for (var i = 0; i < 40; i++) {
          await sleep(100);
          var bars = document.querySelectorAll('[class*="StyledListItemTopBar"]');
          if (bars.length > before) {
            newBar = bars[bars.length - 1];
            console.log(LOG, '5. New item appeared after', (i + 1) * 100, 'ms');
            break;
          }
        }
        if (!newBar) throw new Error('New item never appeared');

        /* 6 ── Fill in values */
        await sleep(300);
        btn.textContent = '⏳ filling';

        var newListItem = newBar.parentElement;
        var newInputs   = getInputs(newListItem);
        console.log(LOG, '6. New item inputs:', newInputs.length);

        if (newInputs.length < 2) {
          var expBtn2 = newBar.querySelector('button:not(.mhs-dup-btn)');
          if (expBtn2) { expBtn2.click(); await sleep(400); }
          newInputs = getInputs(newListItem);
          console.log(LOG, '6b. After expand:', newInputs.length);
        }

        newInputs.forEach(function (inp, idx) {
          if (idx < values.length) setVal(inp, values[idx]);
        });

        newBar.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        btn.textContent = '✅ Done!';
        console.log(LOG, '── Complete ──');
        setTimeout(function () { btn.textContent = '📋 Copy'; }, 2500);

      } catch (err) {
        console.error(LOG, 'Error:', err.message);
        btn.textContent = '⚠ ' + err.message.substring(0, 20);
        setTimeout(function () { btn.textContent = '📋 Copy'; }, 4000);
      }
    }

  })();
  </script>
</body>
</html>
