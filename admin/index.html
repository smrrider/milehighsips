<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mile High Sips — Admin</title>
</head>
<body>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>

  <!--
    Floating admin panel — draggable, outside React's DOM tree.
    Row 1: Quick Copy Event
    Row 2: Open Flyer Generator link
    Position saved in localStorage. Only visible on the Schedule page.
  -->
  <div id="mhs-panel" style="
    position:fixed; z-index:99999;
    background:#1F4E5A; color:#fff; border-radius:8px;
    padding:8px 10px 8px 6px;
    box-shadow:0 4px 18px rgba(0,0,0,.5);
    font-family:-apple-system,sans-serif; font-size:12px;
    display:none; flex-direction:column; gap:6px;
    user-select:none; touch-action:none;
  ">

    <!-- Row 1: drag handle + copy controls -->
    <div style="display:flex;align-items:center;gap:7px;">
      <span id="mhs-drag" title="Drag to reposition" style="
        cursor:grab; font-size:16px; opacity:.5; padding:0 4px 0 2px;
        line-height:1; touch-action:none; flex-shrink:0;
      ">⠿</span>

      <span style="font-weight:700;opacity:.8;white-space:nowrap;flex-shrink:0;">📋 Copy:</span>

      <select id="mhs-select" style="
        padding:4px 6px; border-radius:5px; border:none;
        background:#fff; color:#1F4E5A; font-size:12px; font-weight:600;
        max-width:200px; flex-shrink:1;
      ">
        <option value="">— pick event —</option>
      </select>

      <button id="mhs-copy-btn" style="
        padding:5px 12px; background:#E85A8C; color:#fff; border:none;
        border-radius:6px; font-size:12px; font-weight:700; cursor:pointer;
        white-space:nowrap; flex-shrink:0;
      ">Copy</button>

      <span id="mhs-status" style="
        font-size:11px; opacity:.75; white-space:nowrap;
        max-width:160px; overflow:hidden; text-overflow:ellipsis; flex-shrink:1;
      "></span>
    </div>

    <!-- Row 2: flyer generator link -->
    <div style="padding-left:26px;border-top:1px solid rgba(255,255,255,.15);padding-top:6px;">
      <a href="/schedule-flyer.html" target="_blank" style="
        color:#fff; text-decoration:none; font-size:11px; opacity:.85;
        display:inline-flex; align-items:center; gap:5px;
      ">📄 Open Flyer Generator →</a>
    </div>

  </div>

  <script>
  (function () {
    var LOG = '[MHS]';
    function log() { console.log.apply(console, [LOG].concat(Array.from(arguments))); }

    function setStatus(msg) {
      log(msg);
      var el = document.getElementById('mhs-status');
      if (el) el.textContent = msg;
    }

    /* React-safe input setter */
    function setVal(el, val) {
      try {
        var proto = el.tagName === 'TEXTAREA'
          ? window.HTMLTextAreaElement.prototype
          : window.HTMLInputElement.prototype;
        Object.getOwnPropertyDescriptor(proto, 'value').set.call(el, val);
        el.dispatchEvent(new Event('input',  { bubbles: true }));
        el.dispatchEvent(new Event('change', { bubbles: true }));
      } catch(e) { log('setVal error', e); }
    }

    function getInputs(container) {
      return Array.from(container.querySelectorAll(
        'input:not([type=hidden]):not([type=checkbox]):not([type=radio]):not([type=file]), textarea'
      ));
    }

    function getAllTopBars() {
      return Array.from(document.querySelectorAll('[class*="StyledListItemTopBar"]'));
    }

    function findAddButton() {
      var all = Array.from(document.querySelectorAll('button')).filter(function(b){
        return /^add\b/i.test(b.textContent.trim()) && b.textContent.trim().length < 30;
      });
      return all.length ? all[all.length - 1] : null;
    }

    /* ── Drag to reposition ── */
    function initDrag(panel, handle) {
      var dragging = false;
      var ox = 0, oy = 0;

      function clientXY(e) {
        var src = e.touches ? e.touches[0] : e;
        return { x: src.clientX, y: src.clientY };
      }

      function clamp(val, lo, hi) { return Math.max(lo, Math.min(hi, val)); }

      function applyPos(left, top) {
        panel.style.left   = clamp(left, 0, window.innerWidth  - panel.offsetWidth)  + 'px';
        panel.style.top    = clamp(top,  0, window.innerHeight - panel.offsetHeight) + 'px';
        panel.style.right  = 'auto';
        panel.style.bottom = 'auto';
      }

      function savePos() {
        try { localStorage.setItem('mhs-pos', panel.style.left + ',' + panel.style.top); } catch(e){}
      }

      function loadPos() {
        try {
          var s = localStorage.getItem('mhs-pos');
          if (s) {
            var p = s.split(',');
            applyPos(parseFloat(p[0]), parseFloat(p[1]));
            return true;
          }
        } catch(e){}
        return false;
      }

      if (!loadPos()) {
        panel.style.top   = '12px';
        panel.style.right = '190px';
      }

      handle.addEventListener('mousedown', function(e) {
        if (e.button !== 0) return;
        dragging = true;
        var r = panel.getBoundingClientRect();
        ox = e.clientX - r.left;
        oy = e.clientY - r.top;
        handle.style.cursor = 'grabbing';
        e.preventDefault();
      });

      handle.addEventListener('touchstart', function(e) {
        dragging = true;
        var pt = clientXY(e);
        var r  = panel.getBoundingClientRect();
        ox = pt.x - r.left;
        oy = pt.y - r.top;
        e.preventDefault();
      }, { passive: false });

      document.addEventListener('mousemove', function(e) {
        if (!dragging) return;
        applyPos(e.clientX - ox, e.clientY - oy);
      });

      document.addEventListener('touchmove', function(e) {
        if (!dragging) return;
        var pt = clientXY(e);
        applyPos(pt.x - ox, pt.y - oy);
        e.preventDefault();
      }, { passive: false });

      function stopDrag() {
        if (!dragging) return;
        dragging = false;
        handle.style.cursor = 'grab';
        savePos();
      }
      document.addEventListener('mouseup',  stopDrag);
      document.addEventListener('touchend', stopDrag);
    }

    /* ── Load events from schedule.json ── */
    var cachedEvents = null;

    async function loadEvents() {
      try {
        var resp = await fetch('/schedule.json?_=' + Date.now());
        var data = await resp.json();
        cachedEvents = data.events || [];
        log('Loaded', cachedEvents.length, 'events');
        return cachedEvents;
      } catch(e) {
        log('loadEvents error', e);
        return [];
      }
    }

    /* ── Populate dropdown ── */
    async function refreshSelect() {
      var sel = document.getElementById('mhs-select');
      if (!sel) return;
      var events = await loadEvents();
      var prev = sel.value;
      sel.innerHTML = '<option value="">— pick event —</option>';
      events.forEach(function(ev, i) {
        var label = '';
        if (ev.month) label += ev.month + ' ';
        if (ev.day)   label += ev.day;
        if (ev.year)  label += ', ' + ev.year;
        if (ev.name)  label += ' — ' + ev.name;
        label = label.trim() || ('Event ' + (i + 1));
        var opt = document.createElement('option');
        opt.value = i;
        opt.textContent = label.substring(0, 65);
        sel.appendChild(opt);
      });
      if (prev !== '') sel.value = prev;
    }

    /* ── Copy routine ── */
    function runCopy() {
      log('── runCopy start ──');
      var sel = document.getElementById('mhs-select');
      var idx = parseInt(sel.value, 10);
      if (isNaN(idx)) { setStatus('Pick an event first'); return; }

      var events = cachedEvents;
      if (!events || !events[idx]) { setStatus('Reload page and try again'); return; }
      var ev = events[idx];
      log('Copying:', ev.month, ev.day, ev.year, '—', ev.name);

      var addBtn = findAddButton();
      if (!addBtn) { setStatus('⚠ Add button not found'); return; }

      var beforeInputs = new Set(getInputs(document.body));
      var fieldKeys    = ['month', 'day', 'year', 'name', 'meta'];
      var done = false, filling = false;

      /* ── helpers ── */
      function freshInputs() {
        return getInputs(document.body).filter(function(inp) { return !beforeInputs.has(inp); });
      }

      function doFill() {
        var newInputs = freshInputs();
        if (newInputs.length < 2) { filling = false; return; }
        done = true;
        obs.disconnect();
        clearTimeout(expireTimer);
        log('Filling', Math.min(newInputs.length, fieldKeys.length), 'fields');
        fieldKeys.forEach(function(key, i) {
          if (newInputs[i] && ev[key] != null) {
            setVal(newInputs[i], String(ev[key]));
            log('  set', key, '→', ev[key]);
          }
        });
        if (document.activeElement && document.activeElement !== document.body) {
          document.activeElement.blur();
        }
        var bars = getAllTopBars();
        if (bars.length) bars[bars.length-1].scrollIntoView({ behavior:'smooth', block:'nearest' });
        setStatus('✅ Done — update date & save!');
        log('── Complete ──');
      }

      function tryFill() {
        if (done || filling) return;
        if (freshInputs().length < 2) return;
        filling = true;
        setTimeout(doFill, 250);
      }

      /*
        tryExpand — tries every known strategy to open a collapsed Decap list item.
        1. React __reactProps$ handler (React 18) on ALL descendants — found by
           deep-searching the entire subtree so we don't miss nested wrappers.
        2. Keyboard: focus the button then dispatch Space, which browsers convert
           to a trusted-like activation even from script.
        3. Full pointer+mouse sequence (pointerdown→mousedown→pointerup→mouseup→click).
        Returns true if a React handler was found and invoked.
      */
      function tryExpand(newBar) {
        log('tryExpand — bar class:', newBar.className.substring(0, 60));

        // ── Strategy 1: walk ALL descendants looking for React onClick ──
        var allEls = [newBar].concat(Array.from(newBar.querySelectorAll('*')));
        var reactFired = false;
        for (var i = 0; i < allEls.length && !reactFired; i++) {
          var el = allEls[i];
          for (var k in el) {
            if (!k.startsWith('__reactProps') && !k.startsWith('__reactEventHandlers')) continue;
            var p = el[k];
            if (!p) continue;
            var fn = p.onClick || p.onMouseDown || p.onPointerDown;
            if (!fn) continue;
            try {
              fn({
                preventDefault: function(){}, stopPropagation: function(){},
                stopImmediatePropagation: function(){},
                isPropagationStopped: function(){ return false; },
                isDefaultPrevented: function(){ return false; },
                persist: function(){},
                nativeEvent: { preventDefault: function(){}, stopPropagation: function(){},
                               isTrusted: true, target: el, currentTarget: el, type: 'click' },
                currentTarget: el, target: el, type: 'click',
                bubbles: true, cancelable: true, timeStamp: Date.now(),
              });
              log('  React handler fired on', el.tagName, (el.className||'').substring(0,40));
              reactFired = true;
            } catch(e) { log('  reactHandler error:', e.message); }
            break;
          }
        }

        // ── Strategy 2: keyboard activation on the first button ──
        var btn = newBar.querySelector('button');
        if (btn) {
          btn.focus();
          ['keydown','keypress','keyup'].forEach(function(t) {
            btn.dispatchEvent(new KeyboardEvent(t, {
              key: ' ', code: 'Space', keyCode: 32, which: 32,
              bubbles: true, cancelable: true
            }));
          });
          ['keydown','keypress','keyup'].forEach(function(t) {
            btn.dispatchEvent(new KeyboardEvent(t, {
              key: 'Enter', code: 'Enter', keyCode: 13, which: 13,
              bubbles: true, cancelable: true
            }));
          });
        }

        // ── Strategy 3: full pointer+mouse sequence ──
        [newBar, btn].filter(Boolean).forEach(function(target) {
          var r  = target.getBoundingClientRect();
          var cx = r.left + r.width/2, cy = r.top + r.height/2;
          var base = { bubbles:true, cancelable:true, view:window, clientX:cx, clientY:cy };
          ['pointerdown','mousedown','pointerup','mouseup','click'].forEach(function(type) {
            try { target.dispatchEvent(new (type.startsWith('pointer') ? PointerEvent : MouseEvent)(type, base)); }
            catch(e) {}
          });
        });

        return reactFired;
      }

      /* ── MutationObserver watches for inputs appearing (handles both
            auto-expand and manual › click as a final fallback) ── */
      var obs = new MutationObserver(tryFill);
      obs.observe(document.body, { childList: true, subtree: true });

      var expireTimer = setTimeout(function() {
        obs.disconnect();
        if (!done) setStatus('Timed out — try again');
      }, 60000);

      /* ── Click Add, then drive the expand ── */
      setStatus('Adding…');
      var before = getAllTopBars().length;
      addBtn.click();

      var waitLoop = setInterval(function() {
        if (done) { clearInterval(waitLoop); return; }
        var nowBars = getAllTopBars();
        if (nowBars.length <= before) return;
        clearInterval(waitLoop);

        var newBar = nowBars[nowBars.length - 1];
        log('New bar detected');

        // Wait for React's initial render pass
        setTimeout(function() {
          // Check if item auto-expanded (inputs already in DOM)
          if (freshInputs().length >= 2) {
            log('Item was auto-expanded');
            tryFill();
            return;
          }

          // Not expanded yet — scroll into view then try expanding
          newBar.scrollIntoView({ behavior: 'instant', block: 'center' });
          setStatus('Expanding…');

          // Three rounds of expand attempts, 600 ms apart
          var round = 0;
          function expandRound() {
            if (done || round >= 3) return;
            round++;
            log('Expand round', round);
            requestAnimationFrame(function() {
              requestAnimationFrame(function() {
                tryExpand(newBar);
                setTimeout(function() {
                  if (freshInputs().length >= 2) { tryFill(); }
                  else { expandRound(); }
                }, 600);
              });
            });
          }
          expandRound();

        }, 450);
      }, 100);

      setTimeout(function() {
        clearInterval(waitLoop);
        if (!done && !filling) setStatus('⚠ Click › on the new event to fill it');
      }, 10000);
    }

    /* ── Show/hide based on URL hash ── */
    function checkPage() {
      var panel = document.getElementById('mhs-panel');
      if (!panel) return;
      var onSchedule = window.location.hash.includes('schedule');
      panel.style.display = onSchedule ? 'flex' : 'none';
      if (onSchedule) refreshSelect();
    }

    /* ── Boot ── */
    var panel  = document.getElementById('mhs-panel');
    var handle = document.getElementById('mhs-drag');

    initDrag(panel, handle);

    document.getElementById('mhs-copy-btn').addEventListener('click', function() {
      log('Copy clicked');
      runCopy();
    });

    setTimeout(function() {
      checkPage();
      window.addEventListener('hashchange', function() { setTimeout(checkPage, 500); });
      var obs = new MutationObserver(function() {
        clearTimeout(window._mhsT);
        window._mhsT = setTimeout(checkPage, 700);
      });
      obs.observe(document.body, { childList: true, subtree: false });
    }, 3500);

  })();
  </script>
</body>
</html>
