<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mile High Sips — Admin</title>
  <style>
    /* Duplicate button — shows next to the delete button on each list item */
    .mhs-dup-btn {
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 4px;
      color: inherit;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      line-height: 1;
      margin-right: 6px;
      padding: 3px 8px;
      opacity: 0.7;
      transition: opacity 0.15s, background 0.15s;
      vertical-align: middle;
      white-space: nowrap;
    }
    .mhs-dup-btn:hover { opacity: 1; background: rgba(255,255,255,0.25); }
    .mhs-dup-btn:active { opacity: 0.5; }
  </style>
</head>
<body>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script>
  /* ── Duplicate-event injector ── */
  (function () {

    // Start after CMS has had time to render the page
    setTimeout(start, 3000);

    function start() {
      inject();
      // Re-run whenever the DOM changes (navigation, new items added, etc.)
      var observer = new MutationObserver(function () {
        clearTimeout(window._mhsDupT);
        window._mhsDupT = setTimeout(inject, 400);
      });
      observer.observe(document.body, { childList: true, subtree: true });
    }

    /* ── Inject a 📋 Copy button into every list-item top bar ── */
    function inject() {
      // Decap CMS uses Emotion CSS-in-JS with explicit labels.
      // The label "StyledListItemTopBar" is appended to the generated class,
      // so [class*="StyledListItemTopBar"] reliably targets these elements.
      var topBars = document.querySelectorAll('[class*="StyledListItemTopBar"]');

      topBars.forEach(function (bar) {
        if (bar.dataset.mhsDup) return;       // already processed
        bar.dataset.mhsDup = '1';

        // The last <button> in the top bar is the "Remove" button
        var btns = bar.querySelectorAll('button');
        if (!btns.length) return;
        var removeBtn = btns[btns.length - 1];

        var dupBtn = document.createElement('button');
        dupBtn.className = 'mhs-dup-btn';
        dupBtn.textContent = '📋 Copy';
        dupBtn.title = 'Duplicate this event';
        dupBtn.type = 'button';

        dupBtn.addEventListener('click', function (e) {
          e.stopPropagation();
          e.preventDefault();
          runDuplicate(bar, dupBtn);
        });

        // Insert just before the remove button
        removeBtn.parentNode.insertBefore(dupBtn, removeBtn);
      });
    }

    /* ── Find the list item container for a top bar ── */
    function getItemContainer(bar) {
      // Walk up until we find an element that contains >=3 text inputs/textareas
      // (that's the full expanded list item)
      var el = bar.parentElement;
      for (var i = 0; i < 12; i++) {
        if (!el || el === document.body) break;
        var fields = el.querySelectorAll('input[type="text"], input:not([type]), textarea');
        if (fields.length >= 3) return { el: el, fields: Array.from(fields) };
        el = el.parentElement;
      }
      return null;
    }

    /* ── Find the "Add Events" button for this list ── */
    function getAddButton(bar) {
      var el = bar.parentElement;
      for (var i = 0; i < 25; i++) {
        if (!el || el === document.body) break;
        var found = Array.from(el.querySelectorAll('button')).find(function (b) {
          return /^add\s/i.test(b.textContent.trim());
        });
        if (found) return found;
        el = el.parentElement;
      }
      // Fallback: any "Add " button visible on the page
      return Array.from(document.querySelectorAll('button')).find(function (b) {
        return /^add\s/i.test(b.textContent.trim());
      }) || null;
    }

    /* ── React-compatible value setter ── */
    function setVal(input, value) {
      try {
        var proto = input.tagName === 'TEXTAREA'
          ? window.HTMLTextAreaElement.prototype
          : window.HTMLInputElement.prototype;
        var setter = Object.getOwnPropertyDescriptor(proto, 'value').set;
        setter.call(input, value);
        input.dispatchEvent(new Event('input',  { bubbles: true }));
        input.dispatchEvent(new Event('change', { bubbles: true }));
      } catch (e) { /* ignore */ }
    }

    function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

    /* ── Main duplicate routine ── */
    async function runDuplicate(bar, dupBtn) {
      // 1. Expand the item if collapsed so fields are accessible
      var collapseBtn = bar.querySelector('button');  // first button = collapse toggle
      var isCollapsed = bar.closest('[class*="StyledListItemTopBar"]')
        ? bar.parentElement && bar.parentElement.getAttribute('style') &&
          bar.parentElement.getAttribute('style').includes('none')
        : false;

      if (isCollapsed && collapseBtn) {
        collapseBtn.click();
        await sleep(300);
      }

      // 2. Read field values from this item
      var item = getItemContainer(bar);
      if (!item) {
        dupBtn.textContent = '⚠ Not found';
        setTimeout(function () { dupBtn.textContent = '📋 Copy'; }, 2000);
        return;
      }
      var values = item.fields.map(function (f) { return f.value; });

      // 3. Click "Add" to create a new blank item at the bottom
      var addBtn = getAddButton(bar);
      if (!addBtn) {
        dupBtn.textContent = '⚠ No Add btn';
        setTimeout(function () { dupBtn.textContent = '📋 Copy'; }, 2000);
        return;
      }

      var beforeCount = document.querySelectorAll('[class*="StyledListItemTopBar"]').length;
      addBtn.click();

      // 4. Wait for the new item to appear
      var waited = 0;
      while (waited < 3000) {
        await sleep(100);
        waited += 100;
        if (document.querySelectorAll('[class*="StyledListItemTopBar"]').length > beforeCount) break;
      }
      await sleep(250);  // let React finish rendering

      // 5. Find the newly added item (last one in the list)
      var allBars = document.querySelectorAll('[class*="StyledListItemTopBar"]');
      var newBar  = allBars[allBars.length - 1];
      if (!newBar || newBar === bar) {
        dupBtn.textContent = '⚠ Failed';
        setTimeout(function () { dupBtn.textContent = '📋 Copy'; }, 2000);
        return;
      }

      var newItem = getItemContainer(newBar);
      if (!newItem) {
        dupBtn.textContent = '⚠ No fields';
        setTimeout(function () { dupBtn.textContent = '📋 Copy'; }, 2000);
        return;
      }

      // 6. Fill in the values (copy all except "day" so it's easy to change)
      newItem.fields.forEach(function (input, i) {
        if (values[i] !== undefined) setVal(input, values[i]);
      });

      // 7. Scroll to the new item and show feedback
      newBar.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      dupBtn.textContent = '✅ Copied!';
      setTimeout(function () { dupBtn.textContent = '📋 Copy'; }, 2500);
    }

  })();
  </script>
</body>
</html>
