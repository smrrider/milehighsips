<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mile High Sips — Admin</title>
</head>
<body>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>

  <!--
    Floating admin panel — draggable, outside React's DOM tree.
    Row 1: Quick Copy Event
    Row 2: Open Flyer Generator link
    Position saved in localStorage. Only visible on the Schedule page.
  -->
  <div id="mhs-panel" style="
    position:fixed; z-index:99999;
    background:#1F4E5A; color:#fff; border-radius:8px;
    padding:8px 10px 8px 6px;
    box-shadow:0 4px 18px rgba(0,0,0,.5);
    font-family:-apple-system,sans-serif; font-size:12px;
    display:none; flex-direction:column; gap:6px;
    user-select:none; touch-action:none;
  ">

    <!-- Row 1: drag handle + copy controls -->
    <div style="display:flex;align-items:center;gap:7px;">
      <span id="mhs-drag" title="Drag to reposition" style="
        cursor:grab; font-size:16px; opacity:.5; padding:0 4px 0 2px;
        line-height:1; touch-action:none; flex-shrink:0;
      ">⠿</span>

      <span style="font-weight:700;opacity:.8;white-space:nowrap;flex-shrink:0;">📋 Copy:</span>

      <select id="mhs-select" style="
        padding:4px 6px; border-radius:5px; border:none;
        background:#fff; color:#1F4E5A; font-size:12px; font-weight:600;
        max-width:200px; flex-shrink:1;
      ">
        <option value="">— pick event —</option>
      </select>

      <button id="mhs-copy-btn" style="
        padding:5px 12px; background:#E85A8C; color:#fff; border:none;
        border-radius:6px; font-size:12px; font-weight:700; cursor:pointer;
        white-space:nowrap; flex-shrink:0;
      ">Copy</button>

      <span id="mhs-status" style="
        font-size:11px; opacity:.75; white-space:nowrap;
        max-width:160px; overflow:hidden; text-overflow:ellipsis; flex-shrink:1;
      "></span>
    </div>

    <!-- Row 2: flyer generator link -->
    <div style="padding-left:26px;border-top:1px solid rgba(255,255,255,.15);padding-top:6px;">
      <a href="/schedule-flyer.html" target="_blank" style="
        color:#fff; text-decoration:none; font-size:11px; opacity:.85;
        display:inline-flex; align-items:center; gap:5px;
      ">📄 Open Flyer Generator →</a>
    </div>

  </div>

  <script>
  (function () {
    var LOG = '[MHS]';
    function log() { console.log.apply(console, [LOG].concat(Array.from(arguments))); }

    function setStatus(msg) {
      log(msg);
      var el = document.getElementById('mhs-status');
      if (el) el.textContent = msg;
    }

    /* React-safe input setter */
    function setVal(el, val) {
      try {
        var proto = el.tagName === 'TEXTAREA'
          ? window.HTMLTextAreaElement.prototype
          : window.HTMLInputElement.prototype;
        Object.getOwnPropertyDescriptor(proto, 'value').set.call(el, val);
        el.dispatchEvent(new Event('input',  { bubbles: true }));
        el.dispatchEvent(new Event('change', { bubbles: true }));
      } catch(e) { log('setVal error', e); }
    }

    function getInputs(container) {
      return Array.from(container.querySelectorAll(
        'input:not([type=hidden]):not([type=checkbox]):not([type=radio]):not([type=file]), textarea'
      ));
    }

    function getAllTopBars() {
      return Array.from(document.querySelectorAll('[class*="StyledListItemTopBar"]'));
    }

    function findAddButton() {
      var all = Array.from(document.querySelectorAll('button'));

      /* Priority 1: specifically the "Add events" / "Add Events +" button for the
         main events list — prevents grabbing "Add Photo" inside an expanded event */
      var eventsBtn = all.filter(function(b) {
        var t = b.textContent.trim();
        return /^add\s+events?\b/i.test(t);
      });
      if (eventsBtn.length) return eventsBtn[eventsBtn.length - 1];

      /* Fallback: last short "Add" button */
      var shortAdd = all.filter(function(b) {
        return /^add\b/i.test(b.textContent.trim()) && b.textContent.trim().length < 30;
      });
      return shortAdd.length ? shortAdd[shortAdd.length - 1] : null;
    }

    /* ── Drag to reposition ── */
    function initDrag(panel, handle) {
      var dragging = false;
      var ox = 0, oy = 0;

      function clientXY(e) {
        var src = e.touches ? e.touches[0] : e;
        return { x: src.clientX, y: src.clientY };
      }

      function clamp(val, lo, hi) { return Math.max(lo, Math.min(hi, val)); }

      function applyPos(left, top) {
        panel.style.left   = clamp(left, 0, window.innerWidth  - panel.offsetWidth)  + 'px';
        panel.style.top    = clamp(top,  0, window.innerHeight - panel.offsetHeight) + 'px';
        panel.style.right  = 'auto';
        panel.style.bottom = 'auto';
      }

      function savePos() {
        try { localStorage.setItem('mhs-pos', panel.style.left + ',' + panel.style.top); } catch(e){}
      }

      function loadPos() {
        try {
          var s = localStorage.getItem('mhs-pos');
          if (s) {
            var p = s.split(',');
            applyPos(parseFloat(p[0]), parseFloat(p[1]));
            return true;
          }
        } catch(e){}
        return false;
      }

      if (!loadPos()) {
        panel.style.top   = '12px';
        panel.style.right = '190px';
      }

      handle.addEventListener('mousedown', function(e) {
        if (e.button !== 0) return;
        dragging = true;
        var r = panel.getBoundingClientRect();
        ox = e.clientX - r.left;
        oy = e.clientY - r.top;
        handle.style.cursor = 'grabbing';
        e.preventDefault();
      });

      handle.addEventListener('touchstart', function(e) {
        dragging = true;
        var pt = clientXY(e);
        var r  = panel.getBoundingClientRect();
        ox = pt.x - r.left;
        oy = pt.y - r.top;
        e.preventDefault();
      }, { passive: false });

      document.addEventListener('mousemove', function(e) {
        if (!dragging) return;
        applyPos(e.clientX - ox, e.clientY - oy);
      });

      document.addEventListener('touchmove', function(e) {
        if (!dragging) return;
        var pt = clientXY(e);
        applyPos(pt.x - ox, pt.y - oy);
        e.preventDefault();
      }, { passive: false });

      function stopDrag() {
        if (!dragging) return;
        dragging = false;
        handle.style.cursor = 'grab';
        savePos();
      }
      document.addEventListener('mouseup',  stopDrag);
      document.addEventListener('touchend', stopDrag);
    }

    /* ── Load events from schedule.json ── */
    var cachedEvents = null;

    async function loadEvents() {
      try {
        var resp = await fetch('/schedule.json?_=' + Date.now());
        var data = await resp.json();
        cachedEvents = data.events || [];
        log('Loaded', cachedEvents.length, 'events');
        return cachedEvents;
      } catch(e) {
        log('loadEvents error', e);
        return [];
      }
    }

    /* ── Populate dropdown ── */
    async function refreshSelect() {
      var sel = document.getElementById('mhs-select');
      if (!sel) return;
      var events = await loadEvents();
      var prev = sel.value;
      sel.innerHTML = '<option value="">— pick event —</option>';
      events.forEach(function(ev, i) {
        var label = '';
        if (ev.month) label += ev.month + ' ';
        if (ev.day)   label += ev.day;
        if (ev.year)  label += ', ' + ev.year;
        if (ev.name)  label += ' — ' + ev.name;
        label = label.trim() || ('Event ' + (i + 1));
        var opt = document.createElement('option');
        opt.value = i;
        opt.textContent = label.substring(0, 65);
        sel.appendChild(opt);
      });
      if (prev !== '') sel.value = prev;
    }

    /* ── Overlay pulse beacon — lives in our DOM, React can't touch it ── */
    var _overlay = null;
    var _overlayTarget = null;

    function injectOverlayStyle() {
      if (document.getElementById('mhs-style')) return;
      var s = document.createElement('style');
      s.id = 'mhs-style';
      s.textContent = [
        '@keyframes mhsPulse{',
        '  0%,100%{box-shadow:0 0 0 3px #E85A8C,0 0 0 8px rgba(232,90,140,.5)}',
        '  50%{box-shadow:0 0 0 6px #E85A8C,0 0 0 16px rgba(232,90,140,0)}',
        '}'
      ].join('');
      document.head.appendChild(s);
    }

    function showOverlay(targetEl) {
      injectOverlayStyle();
      removeOverlay();
      _overlayTarget = targetEl;

      var r = targetEl.getBoundingClientRect();
      _overlay = document.createElement('div');
      _overlay.id = 'mhs-overlay';

      /* pointer-events:none means clicks pass THROUGH to the real button below.
         The user clicks what looks like our overlay — React sees a real user click. */
      _overlay.style.cssText = [
        'position:fixed',
        'left:'   + Math.round(r.left - 4)   + 'px',
        'top:'    + Math.round(r.top  - 4)   + 'px',
        'width:'  + Math.round(r.width  + 8) + 'px',
        'height:' + Math.round(r.height + 8) + 'px',
        'pointer-events:none',
        'z-index:999999',
        'background:#E85A8C',
        'border-radius:6px',
        'animation:mhsPulse .65s ease-in-out infinite',
        'display:flex',
        'align-items:center',
        'justify-content:center',
        'color:#fff',
        'font-size:16px',
        'font-weight:700',
        'font-family:-apple-system,sans-serif',
        'cursor:pointer'
      ].join(';');
      _overlay.textContent = '▶';
      document.body.appendChild(_overlay);

      /* Keep overlay aligned if page scrolls */
      _overlay._scrollHandler = function() {
        if (!_overlayTarget || !_overlay) return;
        var rr = _overlayTarget.getBoundingClientRect();
        _overlay.style.left   = Math.round(rr.left - 4) + 'px';
        _overlay.style.top    = Math.round(rr.top  - 4) + 'px';
      };
      window.addEventListener('scroll', _overlay._scrollHandler, true);
    }

    function removeOverlay() {
      if (_overlay) {
        if (_overlay._scrollHandler) window.removeEventListener('scroll', _overlay._scrollHandler, true);
        _overlay.remove();
        _overlay = null;
      }
      _overlayTarget = null;
    }

    /* ── Copy routine ── */
    function runCopy() {
      log('── runCopy start ──');
      var sel = document.getElementById('mhs-select');
      var idx = parseInt(sel.value, 10);
      if (isNaN(idx)) { setStatus('Pick an event first'); return; }

      var events = cachedEvents;
      if (!events || !events[idx]) { setStatus('Reload page and try again'); return; }
      var ev = events[idx];
      log('Copying:', ev.month, ev.day, ev.year, '—', ev.name);

      var addBtn = findAddButton();
      if (!addBtn) { setStatus('⚠ Add button not found'); return; }

      /*
        Count-based diff instead of DOM-node identity.
        React re-renders can replace node references, making the old
        Set-based approach return stale nodes as "fresh".
        New events are always appended at the bottom of the list, so
        slicing from beforeCount reliably captures only the new item's
        inputs regardless of re-renders.
      */
      var beforeCount = getInputs(document.body).length;
      var fieldKeys = ['month', 'day', 'year', 'name', 'meta'];
      var done = false, filling = false;

      function freshInputs() {
        var all = getInputs(document.body);
        return all.slice(beforeCount);
      }

      function doFill() {
        var newInputs = freshInputs();
        if (newInputs.length < 2) { filling = false; return; }
        done = true;
        obs.disconnect();
        clearTimeout(expireTimer);
        removeOverlay(); /* ← dismiss the pulsing beacon */
        log('Filling', Math.min(newInputs.length, fieldKeys.length), 'fields');
        fieldKeys.forEach(function(key, i) {
          if (newInputs[i] && ev[key] != null) {
            setVal(newInputs[i], String(ev[key]));
            log('  set', key, '→', ev[key]);
          }
        });
        if (document.activeElement && document.activeElement !== document.body) {
          document.activeElement.blur();
        }
        var bars = getAllTopBars();
        if (bars.length) bars[bars.length-1].scrollIntoView({ behavior:'smooth', block:'nearest' });
        setStatus('✅ Done — update date & save!');
        log('── Complete ──');
      }

      function tryFill() {
        if (done || filling) return;
        if (freshInputs().length < 2) return;
        filling = true;
        setTimeout(doFill, 200);
      }

      /*
        MutationObserver is the reliable path — it fires whenever Decap adds
        inputs to the DOM (auto-expand OR user clicks ›).  Everything else
        below is just UX to make that one click obvious.
      */
      var obs = new MutationObserver(tryFill);
      obs.observe(document.body, { childList: true, subtree: true });

      var expireTimer = setTimeout(function() {
        obs.disconnect(); removeOverlay();
        if (!done) setStatus('Timed out — try again');
      }, 60000);

      /* 1. Click Add */
      setStatus('Adding…');
      /*
        Snapshot existing bars BY REFERENCE before clicking Add.
        After Add, we find the new bar as the one NOT in this Set —
        avoids being fooled by photo-item bars inside expanded events,
        or by document order placing sub-list bars after the new event bar.
      */
      var beforeBarsSet = new Set(getAllTopBars());
      var before = beforeBarsSet.size;
      addBtn.click();

      /* 2. Once the new bar appears, scroll to it and overlay-pulse its expand arrow */
      var waitLoop = setInterval(function() {
        if (done) { clearInterval(waitLoop); return; }
        var nowBars = getAllTopBars();
        if (nowBars.length <= before) return;
        clearInterval(waitLoop);

        /* Find the specific new bar by identity (not position) */
        var newBars = nowBars.filter(function(b) { return !beforeBarsSet.has(b); });
        var detectedBar = newBars.length === 1 ? newBars[0] : nowBars[nowBars.length - 1];
        log('New bar detected, identity-diff found', newBars.length, 'new bars');

        /* Wait for React to finish re-rendering after the Add */
        setTimeout(function() {

          /* If it auto-expanded, fill straight away */
          if (freshInputs().length >= 2) { log('Auto-expanded'); tryFill(); return; }

          /*
            Re-query for a fresh reference to the new event's bar.
            Use the identity diff again rather than "last bar" so we
            don't accidentally land on a photo-item bar inside an
            already-expanded event.
          */
          function getLiveBar() {
            var bars = getAllTopBars();
            var fresh = bars.filter(function(b) { return !beforeBarsSet.has(b); });
            return fresh.length ? fresh[0] : (bars.length ? bars[bars.length - 1] : null);
          }

          var liveBar = getLiveBar();
          if (!liveBar) { setStatus('👆 Click › on the new event to auto-fill'); return; }

          /* Scroll the new event into view */
          liveBar.scrollIntoView({ behavior: 'instant', block: 'center' });

          /* One paint frame then measure */
          setTimeout(function() {
            var liveBar2 = getLiveBar(); /* re-query in case React remounted */
            if (!liveBar2) { setStatus('👆 Click › on the new event to auto-fill'); return; }

            var btn = liveBar2.querySelector('button');
            if (!btn) { setStatus('👆 Click › on the new event to auto-fill'); return; }

            var r = btn.getBoundingClientRect();
            log('Expand btn rect — left:', Math.round(r.left), 'top:', Math.round(r.top), 'w:', Math.round(r.width), 'h:', Math.round(r.height));

            if (r.width < 2 || r.height < 2) {
              /* Button has no size — element is still off-screen or not painted */
              setStatus('👆 Click › on the new event to auto-fill');
              return;
            }

            showOverlay(btn);
            setStatus('👆 Click the flashing arrow to auto-fill');
          }, 150);

        }, 500);
      }, 100);

      setTimeout(function() {
        clearInterval(waitLoop);
        if (!done && !filling) { removeOverlay(); setStatus('⚠ Expand the new event to fill it'); }
      }, 15000);
    }

    /* ── Show/hide based on URL hash ── */
    function checkPage() {
      var panel = document.getElementById('mhs-panel');
      if (!panel) return;
      var onSchedule = window.location.hash.includes('schedule');
      panel.style.display = onSchedule ? 'flex' : 'none';
      if (onSchedule) refreshSelect();
    }

    /* ── Boot ── */
    var panel  = document.getElementById('mhs-panel');
    var handle = document.getElementById('mhs-drag');

    initDrag(panel, handle);

    document.getElementById('mhs-copy-btn').addEventListener('click', function() {
      log('Copy clicked');
      runCopy();
    });

    setTimeout(function() {
      checkPage();
      window.addEventListener('hashchange', function() { setTimeout(checkPage, 500); });
      var obs = new MutationObserver(function() {
        clearTimeout(window._mhsT);
        window._mhsT = setTimeout(checkPage, 700);
      });
      obs.observe(document.body, { childList: true, subtree: false });
    }, 3500);

  })();
  </script>
</body>
</html>
